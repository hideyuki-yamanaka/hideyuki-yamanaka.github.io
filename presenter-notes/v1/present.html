<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>プレゼンテーション</title>
  <!-- Figmaへ事前接続してスライドの初回表示を速く -->
  <link rel="preconnect" href="https://embed.figma.com" crossorigin />
  <link rel="preconnect" href="https://www.figma.com" crossorigin />
  <link rel="dns-prefetch" href="https://static.figma.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="present">
  <div class="present-overlay" id="overlay">
    <div class="spinner"></div>
    <div id="ovtext">Figmaプロトタイプを読み込み中…</div>
  </div>
  <iframe id="frame" class="present-frame" allowfullscreen allow="fullscreen" title="Figma"></iframe>
  <!-- 軽量モード（画像）用 -->
  <img id="slideImg" hidden alt="スライド" />

  <!-- 画面下のホットゾーン：iframe上ではmousemoveが親に届かないので、ここに来たらナビを出す -->
  <div class="nav-hot" id="navHot"></div>
  <!-- 自動で隠れるページ送りナビ（マウスを動かすと出る） -->
  <div class="pv-nav hidden" id="pvNav">
    <button class="pv-btn" id="pnPrev" title="前へ" aria-label="前へ"><span data-ic="prev"></span></button>
    <span class="pv-count" id="pnCount">– / –</span>
    <button class="pv-btn" id="pnNext" title="次へ" aria-label="次へ"><span data-ic="next"></span></button>
  </div>

  <!-- 共有スライドは発表中に絶対リロードしない（見た目の変更だけ静かに反映） -->
  <script>window.PN_NO_RELOAD = true;</script>
  <script src="icons.js?v=2"></script>
  <script src="store.js?v=9"></script>
  <script>
    const frame = document.getElementById('frame');
    const overlay = document.getElementById('overlay');
    const ovtext = document.getElementById('ovtext');

    // タブ名を「そのプレゼン（カード）の名前」にする（画面共有のウィンドウ選択で分かりやすく）
    document.title = 'プレゼンテーション';

    let lastNodeId = null; // 今表示しているページ
    let MODE = 'live';     // 'live'=Figma埋め込み / 'image'=軽量(画像・回線を使わない)
    let imgIdx = 0;
    const slideImg = document.getElementById('slideImg');

    // ?url= が付いていればそれを、無ければ保存済みURLを使う
    const params = new URLSearchParams(location.search);
    const raw = params.get('url') || PN.getUrl();

    function buildEmbed(input) {
      let u;
      try { u = new URL(input); } catch (e) { return null; }
      u.protocol = 'https:';
      u.hostname = 'embed.figma.com';
      u.searchParams.set('embed-host', location.hostname);
      u.searchParams.set('footer', 'false');
      u.searchParams.set('hide-ui', '1');
      const cid = PN.getClientId();
      if (cid) u.searchParams.set('client-id', cid);
      return u.toString();
    }

    // 軽量モード（画像）：保存済み画像を表示。回線を一切使わない。
    async function showImage(i) {
      const order = PN.loadScripts().order;
      if (!order.length) { ovtext.textContent = 'ページがありません（先に収録してください）'; document.querySelector('.spinner').style.display = 'none'; return; }
      imgIdx = (i % order.length + order.length) % order.length;
      const nodeId = order[imgIdx];
      lastNodeId = nodeId;
      const blob = await PN.getImg(PN.getActiveDeckId(), nodeId);
      if (blob) { if (slideImg._u) URL.revokeObjectURL(slideImg._u); slideImg._u = URL.createObjectURL(blob); slideImg.src = slideImg._u; }
      overlay.classList.add('hidden');
      PN.post({ type: 'node', nodeId });
      updateNavCount();
    }
    function imgNav(dir) {
      const n = PN.loadScripts().order.length;
      if (!n) return;
      const i = (imgIdx + (dir === 'backward' ? -1 : 1) + n) % n;   // 端で反対側へ回る
      showImage(i);
    }

    // 本軸はライブ（Figma埋め込み）。バックアップ画像は「ライブが機能しない時だけ」静かに使う保険。
    let hasBackup = false;   // 保存済み画像があるか
    let liveAlive = false;   // Figmaからイベントが来た＝ライブ稼働中
    PN.countImg(PN.getActiveDeckId(), PN.loadScripts().order).then((n) => { hasBackup = n > 0; });

    async function fallbackToImages() {
      if (MODE === 'image' || !hasBackup) return;
      MODE = 'image';
      frame.style.display = 'none';
      slideImg.hidden = false;
      const order = PN.loadScripts().order;
      await showImage(Math.max(0, order.indexOf(lastNodeId)));  // 今のページから画像で継続
    }

    async function init() {
      if (!raw) { ovtext.innerHTML = '設定ページでFigmaのプロトタイプ共有URLを保存してください。'; document.querySelector('.spinner').style.display = 'none'; return; }
      const embed = buildEmbed(raw);
      if (!embed) { ovtext.textContent = 'URLの形式が正しくありません。'; document.querySelector('.spinner').style.display = 'none'; return; }
      frame.src = embed;
      frame.addEventListener('load', () => setTimeout(() => overlay.classList.add('hidden'), 500));
      // 8秒たってもFigmaから何も来なければ（回線不良など）、保存画像へ自動切替
      setTimeout(() => { if (!liveAlive) fallbackToImages(); }, 8000);
    }
    init();

    // Figma埋め込みからの通知を受け取る
    window.addEventListener('message', (e) => {
      // 送り主が Figma でなければ無視（なりすまし対策）
      if (!/(^https:\/\/embed\.figma\.com$)|(^https:\/\/www\.figma\.com$)/.test(e.origin)) return;
      const msg = e.data || {};
      switch (msg.type) {
        case 'INITIAL_LOAD': {
          liveAlive = true;
          overlay.classList.add('hidden');
          // 自動更新でリロードされた時は、見ていたページへ戻す（発表が中断しないように）
          try {
            if (sessionStorage.getItem('pn_autoreload') === '1') {
              sessionStorage.removeItem('pn_autoreload');
              const back = sessionStorage.getItem('pn_lastnode');
              if (back) setTimeout(() => toFigma({ type: 'NAVIGATE_TO_FRAME_AND_CLOSE_OVERLAYS', data: { nodeId: back } }), 300);
            }
          } catch (e) {}
          break;
        }
        case 'PRESENTED_NODE_CHANGED': {
          liveAlive = true;
          overlay.classList.add('hidden');
          const nodeId = PN.normId(msg.data && msg.data.presentedNodeId);
          if (nodeId) {
            // 【観客に見せない保険】スライド一覧に無いフレーム（＝トークスクリプト等）が
            // 出てしまったら、その場で直前のスライドへ引き戻す。
            // ※ここで ensureCard（未知ページの自動登録）はしない。すると一覧が汚れて
            //   トークスクリプトのフレームがスライド扱いになってしまうため。
            const order = PN.loadScripts().order;
            if (order.length && !order.includes(nodeId) && order.includes(lastNodeId)) {
              toFigma({ type: 'NAVIGATE_TO_FRAME_AND_CLOSE_OVERLAYS', data: { nodeId: lastNodeId } });
              break;
            }
            lastNodeId = nodeId;
            try { sessionStorage.setItem('pn_lastnode', nodeId); } catch (e) {}  // 自動更新後に戻る用
            PN.post({ type: 'node', nodeId });        // カンペ/設定へ通知
            updateNavCount();
          }
          break;
        }
        case 'LOGIN_SCREEN_SHOWN':
          document.querySelector('.spinner').style.display = 'none';
          ovtext.innerHTML = 'Figmaのログイン画面が出ています。<br>このファイルは「リンクを知っている全員が閲覧可」にするか、Figmaにログインしてください。';
          break;
        case 'PASSWORD_SCREEN_SHOWN':
          document.querySelector('.spinner').style.display = 'none';
          ovtext.textContent = 'このプロトタイプはパスワード保護されています。';
          break;
      }
    });

    // カンペ側の「◀ ▶」ボタンから送りの依頼が来たらFigmaへ中継
    // ※ 送信先は '*' でないとFigma埋め込みは受け取らない（embed.figma.com宛だと無視される・実測）
    function toFigma(payload) {
      frame.contentWindow.postMessage(payload, '*');
    }
    // ライブでの送り：5秒たってもページが変わらなければ（回線断など）保存画像へ静かに切替
    let navWatch = null;
    function liveNav(payload) {
      const before = lastNodeId;
      toFigma(payload);
      clearTimeout(navWatch);
      navWatch = setTimeout(() => { if (MODE === 'live' && lastNodeId === before && hasBackup) fallbackToImages(); }, 5000);
    }
    // ページ送りは「スライド一覧」の順番で直接ジャンプする。
    // プロトタイプの流れ（NAVIGATE_FORWARD）に任せると、スライドの次に置いてある
    // トークスクリプトのフレームへ進んでしまい、共有画面に映ってしまうため。
    function slideNav(dir) {
      const order = PN.loadScripts().order;
      if (!order.length) {  // まだ一度も再取得(↻)していない時だけ、従来どおりの送り
        liveNav({ type: dir === 'backward' ? 'NAVIGATE_BACKWARD' : 'NAVIGATE_FORWARD' });
        return;
      }
      let i = order.indexOf(lastNodeId);
      if (i < 0) i = 0;                                  // 現在地が不明なら先頭から
      else i += (dir === 'backward' ? -1 : 1);
      // 端に来たら反対の端へ回る（最後で「次へ」＝1枚目に戻る／1枚目で「前へ」＝最後へ）
      i = (i % order.length + order.length) % order.length;
      liveNav({ type: 'NAVIGATE_TO_FRAME_AND_CLOSE_OVERLAYS', data: { nodeId: order[i] } });
    }
    PN.onMessage((msg) => {
      if (!msg) return;
      if (msg.type === 'nav') {
        if (MODE === 'image') imgNav(msg.dir);
        else slideNav(msg.dir);
      }
      if (msg.type === 'restart') {
        if (MODE === 'image') showImage(0);
        else toFigma({ type: 'RESTART' });
      }
      // 設定でプレゼン（デッキ）を切り替えたら、新しいプロトで開き直す
      if (msg.type === 'deck-changed') {
        location.reload();
      }
      // カンペが後から開いた／同期を求められたら、今のページを教え直す
      if ((msg.type === 'notes-ready' || msg.type === 'sync-request') && lastNodeId) {
        PN.post({ type: 'node', nodeId: lastNodeId });
      }
      // プレゼン名が変わったらタブ名も更新
      if (msg.type === 'decks-updated') { document.title = 'プレゼンテーション'; }
    });

    // --- 自動で隠れるページ送りナビ（マウスを動かすと出て、2.5秒で隠れる／ウィンドウ外で隠れる） ---
    const pvNav = document.getElementById('pvNav');
    let navTimer = null;
    function showNav() { pvNav.classList.remove('hidden'); clearTimeout(navTimer); navTimer = setTimeout(() => pvNav.classList.add('hidden'), 2500); }
    function hideNav() { clearTimeout(navTimer); pvNav.classList.add('hidden'); }
    document.addEventListener('mousemove', showNav);
    document.addEventListener('mouseleave', hideNav);
    window.addEventListener('blur', hideNav);
    // iframe(Figma)の上では親にmousemoveが来ないので、iframeへの侵入と画面下ホットゾーンで再表示する
    frame.addEventListener('mouseenter', showNav);
    slideImg.addEventListener('mousemove', showNav);
    const navHot = document.getElementById('navHot');
    navHot.addEventListener('mouseenter', showNav);
    navHot.addEventListener('mousemove', showNav);
    document.getElementById('pnPrev').onclick = () => { if (MODE === 'image') imgNav('backward'); else slideNav('backward'); showNav(); };
    document.getElementById('pnNext').onclick = () => { if (MODE === 'image') imgNav('forward'); else slideNav('forward'); showNav(); };
    function updateNavCount() {
      const s = PN.loadScripts(); const idx = s.order.indexOf(lastNodeId);
      document.getElementById('pnCount').textContent = (idx >= 0 ? idx + 1 : '–') + ' / ' + (s.order.length || '–');
    }

    // --- 連動のムラ対策：現在ページを定期＆前面復帰時に再配信して常に同期させる ---
    function rebroadcast() { if (lastNodeId) PN.post({ type: 'node', nodeId: lastNodeId }); }
    setInterval(() => { if (!document.hidden) rebroadcast(); }, 1200);   // ハートビート
    document.addEventListener('visibilitychange', () => { if (!document.hidden) rebroadcast(); });
    window.addEventListener('focus', rebroadcast);

    // 発表ウィンドウが開いたことを知らせる
    PN.post({ type: 'present-ready' });
  </script>
</body>
</html>
