<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>発表スライド（トークスクリプト）</title>
  <link rel="preconnect" href="https://embed.figma.com" crossorigin />
  <link rel="preconnect" href="https://www.figma.com" crossorigin />
  <link rel="dns-prefetch" href="https://static.figma.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="notes">
  <div class="notes-top">
    <button class="btn ghost ico" id="pvToggle" title="スライドプレビューを隠す／表示" aria-label="スライドプレビューの表示"><span data-ic="panelLeft"></span></button>
    <span class="grow"></span>
    <div class="font-ctl">
      <button class="btn" id="fdown" title="文字を小さく">A−</button>
      <span class="chip" id="fsize">40px</span>
      <button class="btn" id="fup" title="文字を大きく">A＋</button>
    </div>
  </div>

  <div class="notes-main">
    <!-- 左：プレビュー（共有スライドと同じFigmaをライブで表示） -->
    <div class="notes-preview">
      <iframe id="pv" allow="fullscreen" title="スライドプレビュー"></iframe>
      <img id="pvImg" hidden alt="スライド" />
      <div class="pv-badge" id="pvBadge">スライドの接続待ち…（発表タブを開いてください）</div>
      <!-- 共有スライドと同じピル型ナビ（‹ N/総数 › ↺）。手元から送れる -->
      <div class="pv-nav" id="nPill">
        <button class="pv-btn" id="prev" title="前へ（共有スライドも一緒に戻る）" aria-label="前へ"><span data-ic="prev"></span></button>
        <span class="pv-count"><b id="pnum">–</b><span id="ptotal"></span></span>
        <button class="pv-btn" id="next" title="次へ（共有スライドも一緒に送る）" aria-label="次へ"><span data-ic="next"></span></button>
      </div>
    </div>
    <!-- 中央の境界線：左右ドラッグで幅を変更 -->
    <div class="notes-vsplit" id="notesSplit" title="ドラッグで幅を変更"></div>
    <!-- 右：トークスクリプト（表示 / 直接編集） -->
    <div class="notes-body">
      <div class="notes-scroll" id="displayWrap">
        <div class="notes-label" id="label" hidden></div>
        <div class="notes-script" id="script">発表タブでページを送ると、ここに原稿が出ます。手元の「送る ▶」でも送れます。</div>
      </div>
      <div class="notes-edit" id="editArea" hidden>
        <div id="editScript" class="rich" contenteditable="true" data-ph="テキストを入力してください（太くしたい所をドラッグで選ぶと、太さツールが出ます）"></div>
      </div>
      <div class="notes-editbar">
        <button class="btn" id="editBtn"><span data-ic="edit"></span>このページを編集</button>
        <span class="saved-flash" id="savedFlash">保存しました</span>
        <span class="grow"></span>
        <button class="btn" id="cancelBtn" hidden>キャンセル</button>
        <button class="btn primary" id="saveBtn" hidden>保存</button>
      </div>
    </div>
  </div>


  <script src="icons.js?v=2"></script>
  <script src="weighttool.js?v=1"></script>
  <script src="store.js?v=9"></script>
  <script src="notionsync.js?v=1"></script>
  <script>
    const els = {
      pnum: document.getElementById('pnum'),
      ptotal: document.getElementById('ptotal'),
      label: document.getElementById('label'),
      script: document.getElementById('script'),
      fsize: document.getElementById('fsize'),
      pv: document.getElementById('pv'),
      pvImg: document.getElementById('pvImg'),
      pvBadge: document.getElementById('pvBadge'),
      displayWrap: document.getElementById('displayWrap'),
      editArea: document.getElementById('editArea'),
      editScript: document.getElementById('editScript'),
      editBtn: document.getElementById('editBtn'),
      saveBtn: document.getElementById('saveBtn'),
      cancelBtn: document.getElementById('cancelBtn'),
      savedFlash: document.getElementById('savedFlash'),
    };

    // タブ名（共有ウィンドウ選択で取り違えないよう「共有しない」を明示）
    document.title = (PN.getActiveDeck().name || '発表スライド') + '（トークスクリプト）';

    let currentId = null;
    let pvNode = null;    // プレビューが今表示しているノード（無駄な再ナビ防止）
    let pvReady = false;  // プレビュー埋め込みの読み込み完了フラグ
    let pvDesired = null; // 表示したいノード（読み込み前に来ても後で適用）
    let pvImgNode = null; // 軽量プレビューで今表示している画像のノード
    let editing = false; // 直接編集中か
    let editingId = null;// 編集対象のノード（編集中に送られても対象は固定）

    // ---- 文字サイズ ----（太さはエディター側で原稿に埋め込む。ここでは変えない＝既定 Light 300）
    const F_MIN = 12, F_MAX = 240;                 // 幅を広げた（12〜240px）
    function fStep(px) { return px < 40 ? 2 : px < 80 ? 4 : px < 140 ? 8 : 12; }  // 大きいほど大きく動く
    function applyFont() {
      const px = PN.getFont();
      els.script.style.fontSize = px + 'px';
      els.label.style.fontSize = Math.round(px * 0.42) + 'px';
      els.fsize.textContent = px + 'px';
    }
    document.getElementById('fup').onclick = () => { const p = PN.getFont(); PN.setFont(Math.min(F_MAX, p + fStep(p))); applyFont(); };
    document.getElementById('fdown').onclick = () => { const p = PN.getFont(); PN.setFont(Math.max(F_MIN, p - fStep(p - 1))); applyFont(); };
    applyFont();

    // ---- スライドプレビュー（同じFigmaプロトを埋め込み、共有スライドと同じページへ動かす）----
    function buildEmbed(input) {
      let u;
      try { u = new URL(input); } catch (e) { return null; }
      u.protocol = 'https:';
      u.hostname = 'embed.figma.com';
      u.searchParams.set('embed-host', location.hostname);
      u.searchParams.set('footer', 'false'); // 下部のFigmaフッターを消す
      u.searchParams.set('hide-ui', '1');    // ナビ/UIを消してスライドだけ大きく
      const cid = PN.getClientId();
      if (cid) u.searchParams.set('client-id', cid);
      return u.toString();
    }
    let lightPreview = false; // 軽量モード（画像プレビュー）か
    function loadPreview() {
      pvReady = false; pvNode = null;
      if (lightPreview) { els.pv.hidden = true; els.pvImg.hidden = false; return; } // 埋め込みは使わない
      els.pvImg.hidden = true; els.pv.hidden = false;
      const embed = buildEmbed(PN.getUrl());
      if (embed) els.pv.src = embed;
    }
    // プレビューを指定ノードへ（共有スライドに追従）。読み込み前なら記憶して後で適用。
    async function previewGoto(nodeId) {
      if (!nodeId) return;
      if (lightPreview) {
        if (nodeId === pvImgNode) return;   // 同じページなら再読込しない（ハートビート対策）
        pvImgNode = nodeId;
        const blob = await PN.getImg(PN.getActiveDeckId(), nodeId);
        if (blob) {
          if (els.pvImg._u) URL.revokeObjectURL(els.pvImg._u);
          els.pvImg._u = URL.createObjectURL(blob); els.pvImg.src = els.pvImg._u;
          els.pvImg.hidden = false; els.pvBadge.classList.add('hidden');
        }
        return;
      }
      pvDesired = nodeId;
      applyPreview();
    }
    function applyPreview() {
      if (!pvReady || !pvDesired || pvDesired === pvNode) return;
      pvNode = pvDesired;
      // 送信先は '*'（embed.figma.com宛だと無視される・実測）
      els.pv.contentWindow.postMessage(
        { type: 'NAVIGATE_TO_FRAME_AND_CLOSE_OVERLAYS', data: { nodeId: pvDesired } }, '*');
    }
    let pvFallbackTimer = null;
    function reinitPreview() {
      // 【本軸はライブ】共有スライドと同じFigmaをそのまま埋め込む。
      // 保存画像はFigmaを直した瞬間に古くなるので、プレビューには既定で使わない
      //（共有画面＝ライブ／カンペ＝画像 だと中身がズレるため）。
      lightPreview = false;
      loadPreview();
      // 保険：8秒たっても埋め込みが応答しない（回線不良など）時だけ保存画像へ静かに切替
      clearTimeout(pvFallbackTimer);
      pvFallbackTimer = setTimeout(async () => {
        if (pvReady || lightPreview) return;
        const cnt = await PN.countImg(PN.getActiveDeckId(), PN.loadScripts().order);
        if (!cnt) return;
        lightPreview = true;
        loadPreview();
        if (currentId) previewGoto(currentId);
      }, 8000);
    }
    reinitPreview();
    // プレビューiframe自身のFigmaメッセージは「読み込み完了の合図」だけ使う（操作判断には使わない＝ループ防止）
    window.addEventListener('message', (e) => {
      if (!/figma\.com/.test(e.origin)) return;
      if (e.source !== els.pv.contentWindow) return; // プレビュー埋め込みだけ
      const m = e.data || {};
      if (m.type === 'INITIAL_LOAD') { els.pvBadge.classList.add('hidden'); pvReady = true; applyPreview(); }
    });

    // ---- 原稿の表示更新 ----
    function render(nodeId) {
      const s = PN.loadScripts();
      currentId = nodeId;
      const idx = s.order.indexOf(nodeId);
      const card = s.cards[nodeId];
      els.pnum.textContent = idx >= 0 ? (idx + 1) : '?';
      els.ptotal.textContent = s.order.length ? (' / ' + s.order.length) : '';

      const label = card && card.label ? card.label : '';
      if (label) { els.label.textContent = label; els.label.hidden = false; }
      else { els.label.hidden = true; }

      const html = card && card.html ? card.html : '';
      const plain = card && card.script ? card.script : '';
      // HTMLから中身だけ抜いて「実際に文字があるか」を見る（空タグだけの時はプレースホルダー）
      const stripped = html ? html.replace(/<[^>]*>/g, '').replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').trim() : plain.trim();
      if (!stripped) { els.script.textContent = 'テキストを入力してください'; els.script.classList.add('empty'); }
      else if (html) { els.script.innerHTML = html; els.script.classList.remove('empty'); }   // 太さ付き
      else { els.script.textContent = plain; els.script.classList.remove('empty'); }           // 旧プレーン
    }
    function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    // ---- 発表タブ（＝共有スライド／真実の元）からの通知 ----
    let lastBeat = 0; // 最後に発表タブから合図が来た時刻（接続監視用）
    PN.onMessage((msg) => {
      if (!msg) return;
      if (msg.type === 'present-ready') { lastBeat = Date.now(); }
      if (msg.type === 'node') {
        lastBeat = Date.now();
        render(msg.nodeId);       // 原稿を更新
        previewGoto(msg.nodeId);  // プレビューも同じページへ
      }
      if (msg.type === 'scripts-updated' && currentId) { render(currentId); }
      if (msg.type === 'decks-updated') { document.title = (PN.getActiveDeck().name || '発表スライド') + '（トークスクリプト）'; }
      if (msg.type === 'deck-changed') {
        if (editing) exitEdit();
        document.title = (PN.getActiveDeck().name || '発表スライド') + '（トークスクリプト）';
        currentId = null; pvNode = null; pvDesired = null; pvImgNode = null;
        els.label.hidden = true;
        els.script.textContent = 'プレゼンが切り替わりました。発表タブでページを送ると原稿が出ます。';
        els.script.classList.add('empty');
        els.pnum.textContent = '–'; els.ptotal.textContent = '';
        els.pvBadge.classList.remove('hidden');
        els.pvImg.removeAttribute('src'); els.pvImg.hidden = true;
        reinitPreview();
      }
    });

    // ---- 直接編集（Figma Slides の Edit のように、その場で書いて保存）----
    function enterEdit() {
      if (!currentId) { alert('スライドのページに来てから編集してください（発表タブでそのページを表示）。'); return; }
      editing = true; editingId = currentId;
      const c = (PN.loadScripts().cards[editingId]) || { label: '', script: '' };
      if (c.html != null && c.html !== '') els.editScript.innerHTML = c.html;
      else els.editScript.innerHTML = c.script ? escapeHtml(c.script).replace(/\n/g, '<br>') : '';
      els.displayWrap.hidden = true; els.editArea.hidden = false;
      els.editBtn.hidden = true; els.saveBtn.hidden = false; els.cancelBtn.hidden = false;
      els.editScript.focus();
    }
    function exitEdit() {
      editing = false; editingId = null;
      els.editArea.hidden = true; els.displayWrap.hidden = false;
      els.editBtn.hidden = false; els.saveBtn.hidden = true; els.cancelBtn.hidden = true;
    }
    function saveEdit() {
      if (!editingId) { exitEdit(); return; }
      const s = PN.loadScripts();
      if (!s.order.includes(editingId)) s.order.push(editingId);
      s.cards[editingId] = Object.assign({ label: '', script: '' }, s.cards[editingId],
        { script: els.editScript.innerText, html: els.editScript.innerHTML });
      PN.saveScripts(s);
      PN.post({ type: 'scripts-updated' }); // 設定ページ等にも即反映
      try { if (window.NotionSync) NotionSync.schedule(); } catch (e) {}
      exitEdit();
      render(currentId);
      els.savedFlash.classList.add('show');
      setTimeout(() => els.savedFlash.classList.remove('show'), 1500);
    }
    els.editBtn.onclick = enterEdit;
    els.saveBtn.onclick = saveEdit;
    els.cancelBtn.onclick = () => { exitEdit(); render(currentId); };
    // 編集中は Cmd/Ctrl+Enter で保存、Esc でキャンセル
    els.editScript.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); saveEdit(); }
      if (e.key === 'Escape') { e.preventDefault(); exitEdit(); render(currentId); }
    });
    // 文字を選ぶとふわっと出る太さツール（選んだ所だけ変わる。ページごとに独立）
    WT.init(els.editScript);

    // ---- 手元から送り（共有スライドが真実の元。発表タブへ依頼→跳ね返りで全部が揃う）----
    document.getElementById('next').onclick = () => PN.post({ type: 'nav', dir: 'forward' });
    document.getElementById('prev').onclick = () => PN.post({ type: 'nav', dir: 'backward' });
    window.addEventListener('keydown', (e) => {
      // 編集中・入力欄にフォーカス中はページ送りしない（普通に文字入力させる）
      if (editing) return;
      const t = e.target.tagName;
      if (t === 'TEXTAREA' || t === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ') { PN.post({ type: 'nav', dir: 'forward' }); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { PN.post({ type: 'nav', dir: 'backward' }); e.preventDefault(); }
    });

    // 中央の境界線を左右ドラッグして、プレビュー／原稿の幅を変える（幅は記憶）
    (function () {
      const main = document.querySelector('.notes-main');
      const pane = document.querySelector('.notes-preview');
      const split = document.getElementById('notesSplit');
      // 比率で記憶する（ウィンドウの大きさが変わっても同じ配分で開く）
      const savedRatio = parseFloat(localStorage.getItem('pn_splitr') || '');
      if (savedRatio > 0.1 && savedRatio < 0.9) pane.style.flexBasis = (savedRatio * 100) + '%';
      let dragging = false;
      split.addEventListener('mousedown', (e) => { dragging = true; split.classList.add('active'); document.body.classList.add('col-drag'); e.preventDefault(); });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const r = main.getBoundingClientRect();
        const w = Math.max(r.width * 0.2, Math.min(r.width * 0.8, e.clientX - r.left));
        pane.style.flexBasis = w + 'px';
      });
      window.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false; split.classList.remove('active'); document.body.classList.remove('col-drag');
        const r = main.getBoundingClientRect();
        if (r.width) localStorage.setItem('pn_splitr', String(pane.getBoundingClientRect().width / r.width));
      });
    })();

    // 左のスライドプレビューを畳む／出す（エディターの ◧ と同じ考え方）
    // ボタンが青く光っている＝プレビューが出ている状態。既定は表示。
    (function () {
      const main = document.querySelector('.notes-main');
      const preview = document.querySelector('.notes-preview');
      const editbar = document.querySelector('.notes-editbar');
      const pill = document.getElementById('nPill');
      const btn = document.getElementById('pvToggle');
      function setPreviewVisible(show) {
        main.classList.toggle('nopreview', !show);
        btn.classList.toggle('on', show);
        // ページ送りはプレビューの中に置いてあるので、畳む時は下のバーへ引っ越す
        // （そのままだと一緒に消えて、手元から送れなくなる）
        if (show) preview.appendChild(pill); else editbar.insertBefore(pill, editbar.firstChild);
        // 隠している間はFigma埋め込みが止まることがあるので、戻した時に必ず追いつかせる
        if (show) { pvNode = null; requestSync(); }
        try { localStorage.setItem('pn_showpreview', show ? '1' : '0'); } catch (e) {}
      }
      btn.onclick = () => setPreviewVisible(main.classList.contains('nopreview'));
      let saved = '1';
      try { saved = localStorage.getItem('pn_showpreview') || '1'; } catch (e) {}
      setPreviewVisible(saved !== '0');
    })();

    // ウィンドウの大きさ・位置を記憶（次回「プレゼンを開始」でこの状態で開く）
    (function rememberWindowBox() {
      if (window.name !== 'pn_notes') return;   // アプリが開いた窓の時だけ記憶する
      let t = null;
      const save = () => {
        try {
          localStorage.setItem('pn_win', JSON.stringify({
            w: window.outerWidth, h: window.outerHeight, x: window.screenX, y: window.screenY
          }));
        } catch (e) {}
      };
      window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(save, 400); });
      window.addEventListener('beforeunload', save);
      setTimeout(save, 1000);
    })();

    // 開いた直後、自分自身を最前面へ（発表タブを開くと後ろに隠れがちなので）
    if (window.name === 'pn_notes') {
      const selfFront = () => { try { window.focus(); } catch (e) {} };
      selfFront();
      [80, 250, 600].forEach((t) => setTimeout(selfFront, t));
    }

    // 発表タブに「今のページを教えて」と依頼（開く順番に依存しないように）
    PN.post({ type: 'notes-ready' });

    // 前面に戻った/フォーカスした時は同期を要求（裏で取りこぼしても即回復）
    function requestSync() { PN.post({ type: 'sync-request' }); applyPreview(); }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) requestSync(); });
    window.addEventListener('focus', requestSync);
    setInterval(() => { if (!document.hidden) applyPreview(); }, 1500); // プレビュー取りこぼしの保険

    // 接続監視：発表タブの合図(ハートビート)が4秒来なければ切れかけと判断し、
    // 黙って再同期を要求する（表示は出さない。切れていても画面には出さず自力で復帰する）
    setInterval(() => {
      if (Date.now() - lastBeat >= 4000) PN.post({ type: 'sync-request' });
    }, 1000);
  </script>
</body>
</html>
