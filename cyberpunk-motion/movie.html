<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyberpunk Concept Movie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =========================================================
   30秒 ブランドコンセプトムービー（モーフィング／シェイプアニメーション）
   render.mjs が renderAt(0〜899) を順に呼んで MP4 にする。
   どのコマも「時刻だけ」で絵が決まる（前のコマに依存しない）。
   ========================================================= */
const W = 1920, H = 1080, FPS = 30, DUR = 30;
const CX = W / 2, CY = H / 2;
const C = { a: '#ff2bd6', b: '#00f0ff', c: '#fcee0a', bg: '#05010c', deep: '#1a0433', ink: '#0a0010' };
const COPY = {
  city: ['THE CITY', 'NEVER SLEEPS'],
  form: ['NEITHER DO WE.', 'WE BUILD THE NEXT ERA'],
  words: ['SPEED', 'SIGNAL', 'SOUL'],
  brand: 'NEON//CITY',
  tagline: 'BEYOND THE SIGNAL',
  end: '© 2099 NEON CITY'
};
const CHAPTERS = [
  { s: 0,  label: '01 — SIGNAL' },
  { s: 3,  label: '02 — SHAPE' },
  { s: 8,  label: '03 — CITY' },
  { s: 13, label: '04 — FORM' },
  { s: 19, label: '05 — PULSE' },
  { s: 24, label: '06 — IDENT' }
];
// カットの切れ目（グリッチの強さ付き）
const CUTS = [[3, .5], [8, 1], [13, .8], [14.1, .35], [15.55, .35], [16.95, .35], [19, .9], [19.5, .7], [20.5, .7], [21.5, .7], [22.5, .8], [22.75, .5], [23, .5], [23.25, .5], [23.5, .7], [24, .6]];

const FONT_D = 'Orbitron, sans-serif';
const FONT_M = '"Share Tech Mono", monospace';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const buf = mk(W, H), bctx = buf.getContext('2d');
const bloomCv = mk(W / 2, H / 2), blctx = bloomCv.getContext('2d');

/* ---------- 数学の小道具 ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const expoInOut = t => { t = clamp(t); return t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2; };
const backOut = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const TAU = Math.PI * 2;

/* =========================================================
   2D シェイプ（同じ点数でサンプリング → 点ごとに補間してモーフィング）
   ========================================================= */
const N2 = 256;
function samplePoly(verts) {
  const segs = verts.map((v, i) => { const w = verts[(i + 1) % verts.length]; return { v, w, l: Math.hypot(w[0] - v[0], w[1] - v[1]) }; });
  const total = segs.reduce((s, x) => s + x.l, 0), out = [];
  for (let i = 0; i < N2; i++) {
    let d = i / N2 * total, k = 0;
    while (d > segs[k].l && k < segs.length - 1) { d -= segs[k].l; k++; }
    const s = segs[k], f = s.l ? d / s.l : 0;
    out.push([lerp(s.v[0], s.w[0], f), lerp(s.v[1], s.w[1], f)]);
  }
  return out;
}
const ngon = (n, r, rot = -Math.PI / 2) => Array.from({ length: n }, (_, i) => [Math.cos(rot + i / n * TAU) * r, Math.sin(rot + i / n * TAU) * r]);
const SHAPE = {
  circle: r => Array.from({ length: N2 }, (_, i) => { const a = -Math.PI / 2 + i / N2 * TAU; return [Math.cos(a) * r, Math.sin(a) * r]; }),
  poly: (n, r, rot) => samplePoly(ngon(n, r, rot)),
  star: (r, ri) => samplePoly(Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i / 10 * TAU, rr = i % 2 ? ri : r; return [Math.cos(a) * rr, Math.sin(a) * rr]; })),
  // 平たい輪（行って戻る）＝線に見えるが閉じた形なので円に変形できる
  line: (len, wave = 0, t = 0) => Array.from({ length: N2 }, (_, i) => {
    const f = i < N2 / 2 ? i / (N2 / 2) : 2 - i / (N2 / 2);
    const x = (f - .5) * len;
    const env = Math.sin(f * Math.PI);
    const y = wave * env * (Math.sin(f * 26 + t * 14) * .7 + Math.sin(f * 61 - t * 23) * .3);
    return [x, y + (i < N2 / 2 ? -.5 : .5)];
  })
};
function morph(A, B, k) { return A.map((p, i) => [lerp(p[0], B[i][0], k), lerp(p[1], B[i][1], k)]); }
function strokePts(pts, x, y, s = 1, rot = 0) {
  ctx.beginPath();
  const c = Math.cos(rot), si = Math.sin(rot);
  pts.forEach(([px, py], i) => { const X = x + (px * c - py * si) * s, Y = y + (px * si + py * c) * s; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
  ctx.closePath();
}

/* =========================================================
   粒子（3D）：爆発 → 文字 → 文字 → 球 → 立方体 → ドーナツ → 二重らせん → 輪
   ========================================================= */
const P = 6500;
const PT = {};
function textTargets(str, size) {
  const oc = mk(W, H), g = oc.getContext('2d');
  g.font = `900 ${size}px ${FONT_D}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  let s = size; const w = g.measureText(str).width;
  if (w > W * .86) { s = size * W * .86 / w; g.font = `900 ${s}px ${FONT_D}`; }
  g.fillStyle = '#fff'; g.fillText(str, CX, CY);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x - CX, y - CY, 0]);
  // 並びを種つきで混ぜてから均等に拾う
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(hash(i * 3.1 + str.length) * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return Array.from({ length: P }, (_, i) => pts[Math.floor(i * pts.length / P)]);
}
function buildParticles() {
  PT.point = Array.from({ length: P }, () => [0, 0, 0]);
  PT.explode = Array.from({ length: P }, (_, i) => {
    const u = hash(i) * 2 - 1, a = hash(i + 7) * TAU, r = 260 + Math.pow(hash(i + 13), .6) * 900, q = Math.sqrt(1 - u * u);
    return [Math.cos(a) * q * r * 1.5, u * r * .8, Math.sin(a) * q * r];
  });
  PT.text1 = textTargets(COPY.city[0], 250);
  PT.text2 = textTargets(COPY.city[1], 250);
  PT.sphere = Array.from({ length: P }, (_, i) => {
    const y = 1 - (i + .5) / P * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996;
    return [Math.cos(th) * r * 300, y * 300, Math.sin(th) * r * 300];
  });
  PT.cube = Array.from({ length: P }, (_, i) => {
    // 12本の辺＋面に薄く
    const s = 230;
    if (i % 3) {
      const e = Math.floor(hash(i + 17) * 12), f = hash(i) * 2 - 1, A = [-1, 1];
      const p = e < 4 ? [f, A[e & 1], A[e >> 1]] : e < 8 ? [A[e & 1], f, A[(e - 4) >> 1]] : [A[e & 1], A[(e - 8) >> 1], f];
      return p.map(v => v * s);
    }
    const face = i % 6, a = hash(i) * 2 - 1, b = hash(i + 3) * 2 - 1, sg = face % 2 ? 1 : -1;
    const p = face < 2 ? [sg, a, b] : face < 4 ? [a, sg, b] : [a, b, sg];
    return p.map(v => v * s);
  });
  PT.torus = Array.from({ length: P }, (_, i) => {
    const u = (i % 140) / 140 * TAU, v = Math.floor(i / 140) / (P / 140) * TAU, R = 270, r = 95;
    return [(R + r * Math.cos(u)) * Math.cos(v), r * Math.sin(u), (R + r * Math.cos(u)) * Math.sin(v)];
  });
  PT.helix = Array.from({ length: P }, (_, i) => {
    const k = i % 3, f = hash(i * 1.7), y = (f - .5) * 820, a = f * TAU * 3.2, r = 170;
    if (k < 2) { const ph = k * Math.PI, j = (hash(i + 5) - .5) * 14; return [Math.cos(a + ph) * r + j, y, Math.sin(a + ph) * r + j]; }
    const fr = Math.floor(f * 34) / 34, ya = (fr - .5) * 820, aa = fr * TAU * 3.2, m = hash(i + 9) * 2 - 1;
    return [Math.cos(aa) * r * m, ya, Math.sin(aa) * r * m];
  });
  PT.ring = Array.from({ length: P }, (_, i) => { const a = i / P * TAU, r = 260 + (hash(i) - .5) * 10; return [Math.cos(a) * r, Math.sin(a) * r, 0]; });
  PT.col = Array.from({ length: P }, (_, i) => { const h = hash(i + 101); return h < .58 ? C.b : h < .88 ? C.a : '#ffffff'; });
  PT.swirl = Array.from({ length: P }, (_, i) => [hash(i + 21) * 2 - 1, hash(i + 33) * 2 - 1, hash(i + 44) * 2 - 1]);
}
// [開始, 終了, 元, 先, ずらし幅, 渦の強さ, 回転の重み(元→先)]
const PSEG = [
  [8.0, 8.45, 'point', 'explode', 0, 0, 0, 0],
  [8.55, 9.5, 'explode', 'text1', .38, 160, 0, 0],
  [10.2, 11.15, 'text1', 'text2', .34, 140, 0, 0],
  [12.0, 12.95, 'text2', 'sphere', .3, 220, 0, 1],
  [13.75, 14.45, 'sphere', 'cube', .22, 90, 1, 1],
  [15.2, 15.9, 'cube', 'torus', .22, 120, 1, 1],
  [16.6, 17.3, 'torus', 'helix', .22, 120, 1, 1],
  [18.2, 18.95, 'helix', 'ring', .25, 160, 1, 0]
];
function drawParticles(t) {
  if (t < PSEG[0][0] || t > 19.2) return;
  let seg = PSEG[0], hold = false;
  for (const s of PSEG) { if (t >= s[0]) seg = s; }
  const [t0, t1, A, B, stag, swirl, wa, wb] = seg;
  const rotK = easeInOut(prog(t, t0, t1));
  const rw = lerp(wa, wb, rotK);
  const tt = Math.max(0, t - 12);
  const ay = tt * .9 * rw, ax = (.35 + Math.sin(tt * .6) * .25) * rw;
  const cay = Math.cos(ay), say = Math.sin(ay), cax = Math.cos(ax), sax = Math.sin(ax);
  const isExplode = A === 'point';
  const out = prog(t, 18.95, 19.2);
  blctx.setTransform(.5, 0, 0, .5, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < P; i++) {
    const pa = PT[A][i], pb = PT[B][i];
    const d = stag * ((pb[0] + W / 2) / W * .75 + hash(i + 3) * .25);
    let k = (t - t0 - d) / (t1 - t0 - stag);
    k = isExplode ? easeOut(prog(t, t0, t1)) : expoInOut(k);
    const sw = Math.sin(Math.PI * k) * swirl, s3 = PT.swirl[i];
    let x = lerp(pa[0], pb[0], k) + s3[0] * sw, y = lerp(pa[1], pb[1], k) + s3[1] * sw, z = lerp(pa[2], pb[2], k) + s3[2] * sw;
    if (isExplode) { const dr = 1 + (t - t0) * .15; x *= dr; y *= dr; z *= dr; }
    // 保持中の小さな揺れ（文字の時）
    if (B.startsWith('text') && k >= 1) { x += Math.sin(t * 3 + i) * 1.2; y += Math.cos(t * 2.6 + i * 1.3) * 1.2; }
    // 回転
    const x1 = x * cay + z * say, z1 = -x * say + z * cay;
    const y1 = y * cax - z1 * sax, z2 = y * sax + z1 * cax;
    const f = 1000, s = f / (f + z2);
    if (s <= 0) continue;
    const px = CX + x1 * s, py = CY + y1 * s, sz = 3 * s;
    const a = clamp(.35 + s * .6) * (1 - out);
    ctx.globalAlpha = a; ctx.fillStyle = PT.col[i];
    ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  return B;
}

/* =========================================================
   文字の部品
   ========================================================= */
function setFont(size, wt = 900, fam = FONT_D, sp = '0px') { ctx.font = `${wt} ${size}px ${fam}`; if ('letterSpacing' in ctx) ctx.letterSpacing = sp; }
function neonText(str, x, y, size, o = {}) {
  setFont(size, o.weight || 900, o.family || FONT_D, o.spacing || '0px');
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  const al = o.alpha ?? 1, sp = o.split ?? 3;
  if (sp > 0) {
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = al * .85;
    ctx.fillStyle = o.ca || C.a; ctx.fillText(str, x - sp, y);
    ctx.fillStyle = o.cb || C.b; ctx.fillText(str, x + sp, y);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = al; ctx.shadowColor = o.glow || C.a; ctx.shadowBlur = o.blur ?? 30;
  ctx.fillStyle = o.color || '#f6f4ff'; ctx.fillText(str, x, y);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1; setFont(10);
}
function mono(text, x, y, fs, color, align = 'left', alpha = 1, sp = '0.12em') {
  setFont(fs, 400, FONT_M, sp); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.globalAlpha = 1; setFont(10);
}
// 色の帯が伸びて文字を覆い、抜けると文字が現れる（ブロックリビール）
function blockReveal(text, x, y, size, lt, o = {}) {
  if (lt < 0) return;
  setFont(size, o.weight || 900, o.family || FONT_D, o.spacing || '0px');
  const tw = ctx.measureText(text).width, th = size * 1.05;
  const left = o.align === 'left' ? x : x - tw / 2;
  const d = o.dur || .32;
  const a = expoInOut(lt / d), b = expoInOut((lt - d) / d);
  const outK = o.out != null ? expoInOut((lt - o.out) / d) : 0;
  const vis0 = left + tw * outK, vis1 = left + tw * b;
  if (vis1 > vis0) {
    ctx.save(); ctx.beginPath(); ctx.rect(vis0, y - th, vis1 - vis0, th * 2); ctx.clip();
    if (o.plain) { setFont(size, o.weight || 900, o.family || FONT_D, o.spacing || '0px'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = o.color || '#fff'; ctx.fillText(text, left, y); }
    else neonText(text, left, y, size, { align: 'left', color: o.color, split: o.split ?? 2, blur: o.blur ?? 22, spacing: o.spacing, weight: o.weight, family: o.family });
    ctx.restore();
  }
  // 帯
  const out2 = o.out != null ? expoInOut((lt - o.out + d) / d) : 0;
  const b0 = o.out != null && lt > o.out - d ? left + tw * (outK) : left + tw * b;
  const b1 = o.out != null && lt > o.out - d ? left + tw * out2 : left + tw * a;
  if (b1 > b0 + .5) { ctx.fillStyle = o.bar || C.c; ctx.fillRect(b0, y - th / 2, b1 - b0, th); }
}
function brackets(x, y, w, h, k, color, alpha = 1, lw = 2) {
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = lw;
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(px, py + k * sy); ctx.lineTo(px, py); ctx.lineTo(px + k * sx, py); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}
const GLYPHS = '#$%&*<>/\\|01XZ@!?';
function scramble(text, p, frame) {
  return [...text].map((ch, i, arr) => {
    const th = i / arr.length * .7 + hash(i) * .2;
    return ch === ' ' ? ' ' : p >= th + .1 ? ch : p > th - .2 ? GLYPHS[Math.floor(hash(i * 7 + frame) * GLYPHS.length)] : ' ';
  }).join('');
}

/* =========================================================
   背景
   ========================================================= */
function bgDeep(t, strength = 1) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, W * .6);
  g.addColorStop(0, rgba(C.deep, .9 * strength)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// 波打つ点の格子
function dotGrid(t, alpha, cx = CX, cy = CY) {
  if (alpha <= 0) return;
  const sp = 36;
  ctx.fillStyle = C.b;
  for (let y = sp / 2; y < H; y += sp) for (let x = sp / 2; x < W; x += sp) {
    const d = Math.hypot(x - cx, y - cy), w = Math.max(0, Math.sin(d * .016 - t * 5));
    const s = 1.2 + w * 3.2;
    ctx.globalAlpha = alpha * (.12 + w * .4);
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
// 目盛りの輪（回転）
function tickRing(r, n, t, speed, color, alpha, drawK = 1, long = 5) {
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(t * speed);
  ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 1.5;
  const m = Math.floor(n * drawK);
  for (let i = 0; i < m; i++) {
    const a = i / n * TAU, l = i % long ? 8 : 20;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); ctx.lineTo(Math.cos(a) * (r - l), Math.sin(a) * (r - l)); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function dashRing(r, t, speed, color, alpha, drawK, dash = [6, 14], lw = 2) {
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(t * speed);
  ctx.setLineDash(dash); ctx.lineDashOffset = -t * 60;
  ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU * drawK); ctx.stroke();
  ctx.restore(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}

/* =========================================================
   章ごとの描画
   ========================================================= */
// 01 — SIGNAL（0〜3s）：点 → 線 → 波形 → 円
function ch1(t) {
  bgDeep(t, prog(t, .3, 2.5));
  const dotIn = easeOut(prog(t, .1, .5));
  if (t < .7) {
    // 光の点と波紋
    ctx.fillStyle = '#fff'; ctx.shadowColor = C.b; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(CX, CY, 7 * dotIn * (1 + Math.sin(t * 20) * .1), 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    for (let k = 0; k < 2; k++) {
      const p = prog(t, .15 + k * .2, .65 + k * .2);
      if (p > 0 && p < 1) { ctx.strokeStyle = rgba(C.b, 1 - p); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, 10 + p * 120, 0, TAU); ctx.stroke(); }
    }
    return;
  }
  const len = 1300 * expoInOut(prog(t, .7, 1.35)) + 14;
  const wave = 90 * easeInOut(prog(t, 1.35, 2.0)) * (1 - easeIn(prog(t, 2.2, 2.55)));
  const line = SHAPE.line(len, wave, t);
  const k = easeInOut(prog(t, 2.35, 3.0));
  const pts = k > 0 ? morph(line, SHAPE.circle(220), k) : line;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.shadowColor = C.b; ctx.shadowBlur = 24;
  strokePts(pts, CX, CY, 1, k * Math.PI); ctx.stroke(); ctx.shadowBlur = 0;
  // 波形の残像（色ずれ）
  if (wave > 1) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(C.a, .6); ctx.lineWidth = 2; strokePts(pts, CX - 6, CY + 3); ctx.stroke();
    ctx.strokeStyle = rgba(C.b, .6); strokePts(pts, CX + 6, CY - 3); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  // 両端の小さな目盛りと文字
  const la = prog(t, .9, 1.2) * (1 - prog(t, 2.3, 2.6));
  if (la > 0) {
    mono('INITIALIZING SIGNAL', CX, CY + 120, 20, C.b, 'center', la, '0.4em');
    mono(`${(t * 1000 | 0).toString().padStart(5, '0')} Hz`, CX - len / 2, CY - 40, 16, C.a, 'left', la);
    mono('CH.07', CX + len / 2, CY - 40, 16, C.a, 'right', la);
  }
}

// 02 — SHAPE（3〜8s）：拍ごとにモーフ＋残像の尾
const SH_KEYS = (() => {
  const r = 220;
  return [
    [3.0, SHAPE.circle(r)], [3.75, SHAPE.poly(6, r)], [4.5, SHAPE.poly(3, r * 1.12)], [5.25, SHAPE.poly(4, r, -Math.PI / 4)],
    [6.0, SHAPE.star(r * 1.1, r * .48)], [6.75, SHAPE.circle(r)]

})();
function shapeAt(t) {
  let i = 0; while (i < SH_KEYS.length - 1 && t >= SH_KEYS[i + 1][0]) i++;

  const B = SH_KEYS[i + 1][1], t1 = SH_KEYS[i + 1][0];
  const k = easeInOut(prog(t, t1 - .42, t1));
  return { pts: morph(A, B, k), rot: (i + k) * Math.PI / 3 };
}
function ch2(t) {

  dashRing(330, t, .25, C.b, .7 * fade, rk);
  dashRing(372, t, -.18, C.a, .5 * fade, expoInOut(prog(u, .3, 1.1)), [2, 8], 1.5);
  tickRing(420, 120, t, .06, C.b, .45 * fade, expoInOut(prog(u, .4, 1.3)));
  // 収縮 → 点 → 弾ける（7.2〜8）
  const pre = backOut(prog(t, 7.2, 7.45)) * .12, col = easeIn(prog(t, 7.45, 7.95));
  const scale = (1 + pre) * (1 - col);
  // 残像の尾（少し前の形を大きく薄く）
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 9; k >= 1; k--) {
    const s = shapeAt(t - k * .05);
    ctx.strokeStyle = k % 2 ? C.a : C.b; ctx.globalAlpha = (1 - k / 10) * .45 * fade; ctx.lineWidth = 2;
    strokePts(s.pts, CX, CY, scale * (1 + k * .055), s.rot + t * .3); ctx.stroke();
  }

  strokePts(s.pts, CX, CY, scale, s.rot + t * .3); ctx.stroke(); ctx.shadowBlur = 0;
  // 形の中を斜線で塗る（拍の瞬間だけ）
  SH_KEYS.slice(1).forEach(([kt]) => {
    const p = prog(t, kt, kt + .35);
    if (p > 0 && p < 1) {
      ctx.save(); strokePts(s.pts, CX, CY, scale, s.rot + t * .3); ctx.clip();
      ctx.strokeStyle = rgba(C.a, .55 * (1 - p)); ctx.lineWidth = 3;
      for (let x = -300; x < 300; x += 14) { ctx.beginPath(); ctx.moveTo(CX + x - 200 + p * 60, CY - 260); ctx.lineTo(CX + x + 200 + p * 60, CY + 260); ctx.stroke(); }
      ctx.restore();
    }
  });

  const names = ['CIRCLE', 'HEXAGON', 'TRIANGLE', 'SQUARE', 'STAR', 'CIRCLE'];
  let ni = 0; SH_KEYS.forEach(([kt], i) => { if (t >= kt - .2) ni = i; });
  mono(`FORM_${String(ni + 1).padStart(2, '0')}  ${names[ni]}`, CX + 470, CY + 330, 18, C.c, 'left', fade);
  // 文字：SIGNAL DETECTED
  blockReveal('SIGNAL', 150, H - 190, 96, u - .9, { align: 'left', out: 3.4 });
  blockReveal('DETECTED', 150, H - 100, 44, u - 1.25, { align: 'left', out: 3.2, bar: C.b, spacing: '0.3em', weight: 500 });
  // 点が弾ける閃光

  if (fl > 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(CX, CY, 6 + fl * 30, 0, TAU); ctx.fill(); }
}

// 03 — CITY / 04 — FORM（8〜19s）：粒子
function ch34(t) {

    mono(`ROT ${((t - 12) * 51.6 % 360).toFixed(1)}°`, W - 140, 182, 16, C.b, 'right', na);
  }
}

// 05 — PULSE（19〜24s）
function wordCard(word, lt, bg, ink, kind) {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (kind === 'speed') {
    for (let i = 0; i < 26; i++) {
      const y = hash(i) * H, len = 200 + hash(i + 1) * 700, v = 2600 + hash(i + 2) * 3000;
      const x = ((hash(i + 3) * (W + 900) + lt * v) % (W + 900)) - 450;
      ctx.fillStyle = rgba(ink, .12 + hash(i + 4) * .25); ctx.fillRect(x - len, y, len, 2 + hash(i + 5) * 10);
    }

    ctx.strokeStyle = rgba(ink, .25); ctx.lineWidth = 4;
    for (let k = 0; k < 9; k++) { const r = (lt * 700 + k * 150) % 1350; ctx.globalAlpha = 1 - r / 1350; ctx.beginPath(); ctx.arc(CX, CY, r, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1;
  } else {
    // soul：外周から中心へ回転する四角
    ctx.strokeStyle = rgba(C.a, .6); ctx.lineWidth = 2;
    for (let k = 0; k < 12; k++) {
      const s = ((1 - ((lt * .9 + k / 12) % 1)) * 1400);
      ctx.save(); ctx.translate(CX, CY); ctx.rotate(s * .002 + k * .1); ctx.globalAlpha = clamp(s / 600) * .7; ctx.strokeRect(-s / 2, -s / 2, s, s); ctx.restore();
    }

  }

  ctx.save();
  ctx.translate(CX + (kind === 'speed' ? (1 - enter) * 700 : 0), CY);

  const sc = kind === 'signal' ? 1.15 - enter * .15 + lt * .04 : 1;

    const fk = expoInOut((lt - .25) / .5);
    ctx.save(); ctx.beginPath(); ctx.rect(-W, size * .5 - size * fk * 1.1, W * 2, H); ctx.clip();
    neonText(word, 0, 0, size, { split: 5, blur: 40 }); ctx.restore();
  } else {
    neonText(word, 0, 0, size, { color: ink, blur: 0, split: (1 - enter) * 30 + 3, ca: '#ffffff', cb: kind === 'speed' ? C.b : C.a });
  }

}
function cellsCover(lt, dur, color, reverse = false) {
  // マス目が中心から順に縮んで消える（reverse=false）／広がって覆う（true）
  const cs = 120, cols = W / cs, rows = Math.ceil(H / cs), maxD = Math.hypot(cols / 2, rows / 2);
  ctx.fillStyle = color;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const d = Math.hypot(i + .5 - cols / 2, j + .5 - rows / 2) / maxD;
    let k = expoInOut((lt - d * dur * .55) / (dur * .45));

}
function ch5(t) {

    const k = expoInOut(u / .5), R = 260 + k * 1150;
    ctx.fillStyle = C.a; ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.fill();
    ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(CX, CY, Math.max(0, R - 30 - k * 400), 0, TAU); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
    return;
  }
  if (u < 1.5) { wordCard(COPY.words[0], u - .5, C.a, C.ink, 'speed'); return; }
  if (u < 2.5) { wordCard(COPY.words[1], u - 1.5, C.b, C.ink, 'signal'); cellsCover(u - 1.5, .4, C.a); return; }

    ctx.fillStyle = bgs[i]; ctx.fillRect(0, 0, W, H);

    const s = .7 + easeOut(lt / .25) * .5;

    ctx.lineWidth = 3; strokePts(shapes[i], CX, CY, s * 1.45, -i * .4 - lt * 3); ctx.stroke();

}

// 06 — IDENT（24〜30s）
const MARK_R = 96;
function ch6(t, frame) {
  const u = t - 24;
  bgDeep(t, prog(u, .2, 1.5));
  dotGrid(t * .4, .5 * prog(u, 1, 2.2), CX, H * .36);
  const my = H * .35;
  // 線 → 六角形（ロゴマーク）
  const len = lerp(1400, 2 * MARK_R, expoInOut(prog(u, 0, .35)));
  const k = expoInOut(prog(u, .25, .85));
  const pts = morph(SHAPE.line(len), SHAPE.poly(6, MARK_R), k);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.shadowColor = C.b; ctx.shadowBlur = 26;
  strokePts(pts, CX, lerp(CY, my, k), 1, 0); ctx.stroke(); ctx.shadowBlur = 0;
  // 六角の外側に回る輪
  const ra = prog(u, .8, 1.3);
  if (ra > 0) {
    ctx.save(); ctx.translate(0, my - CY);
    dashRing(MARK_R + 34, t, .3, C.b, .6 * ra, expoInOut(ra), [4, 10], 1.5);
    tickRing(MARK_R + 60, 90, t, -.08, C.a, .4 * ra, expoInOut(ra), 15);
    ctx.restore();
  }
  // 中の2本の斜線（下から滑り込む）
  [-20, 20].forEach((dx, i) => {
    const p = backOut(prog(u, .75 + i * .08, 1.15 + i * .08));
    if (p <= 0) return;
    ctx.save(); strokePts(SHAPE.poly(6, MARK_R - 6), CX, my); ctx.clip();
    ctx.fillStyle = i ? C.b : C.a; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
    const oy = (1 - p) * 160;
    ctx.beginPath(); ctx.moveTo(CX + dx - 16, my + 46 + oy); ctx.lineTo(CX + dx + 14, my - 46 + oy); ctx.lineTo(CX + dx + 30, my - 46 + oy); ctx.lineTo(CX + dx, my + 46 + oy); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  // ブランド名：1文字ずつブロックで出る
  const by = H * .6, bs = 132;
  setFont(bs, 900, FONT_D, '0.08em');
  const chars = [...COPY.brand];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = CX - total / 2;
  const glow = prog(u, 3.9, 4.6);
  chars.forEach((ch, i) => {
    const lt = u - 1.2 - i * .06;
    blockReveal(ch, x, by, bs, lt, { align: 'left', bar: i % 3 === 0 ? C.a : i % 3 === 1 ? C.b : C.c, split: 3, blur: 30, spacing: '0.08em', dur: .22 });
    x += widths[i];
  });
  // 光が横切る
  if (glow > 0 && glow < 1) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gx = CX - total / 2 - 200 + glow * (total + 400);
    const gg = ctx.createLinearGradient(gx - 120, 0, gx + 120, 0);
    gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.55)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(gx - 120, by - bs * .6, 240, bs * 1.2);
    ctx.restore();
  }
  // タグライン
  const ta = prog(u, 2.3, 3.2);
  if (ta > 0) {
    const n = Math.floor(ta * COPY.tagline.length);
    mono(COPY.tagline.slice(0, n), CX, by + 118, 30, C.c, 'center', 1, '0.55em');
    const lw = 160 * expoInOut(prog(u, 2.3, 2.9));
    ctx.fillStyle = C.c; ctx.fillRect(CX - 560, by + 117, lw, 2); ctx.fillRect(CX + 560 - lw, by + 117, lw, 2);
  }
  mono(COPY.end, CX, H - 70, 16, C.b, 'center', prog(u, 3.3, 3.9) * .8);
}

/* =========================================================
   仕上げ（光のにじみ・走査線・粒子ノイズ・周辺減光・グリッチ）
   ========================================================= */
let scanPat, noisePats = [], vigCv;
function buildPost() {
  const sc = mk(1, 3), sg = sc.getContext('2d'); sg.fillStyle = '#000'; sg.fillRect(0, 0, 1, 1);
  scanPat = ctx.createPattern(sc, 'repeat');
  for (let k = 0; k < 6; k++) {
    const n = mk(160, 160), ng = n.getContext('2d'), id = ng.createImageData(160, 160);
    for (let i = 0; i < id.data.length; i += 4) { const v = hash(i * .37 + k * 999) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    ng.putImageData(id, 0, 0); noisePats.push(ctx.createPattern(n, 'repeat'));
  }
  vigCv = mk(W / 2, H / 2);
  const vg = vigCv.getContext('2d'), r = Math.hypot(W, H) / 4;
  const gr = vg.createRadialGradient(W / 4, H / 4, r * .4, W / 4, H / 4, r);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
  vg.fillStyle = gr; vg.fillRect(0, 0, W / 2, H / 2);
}
function bloom(amount) {
  if (amount <= 0) return;
  blctx.setTransform(1, 0, 0, 1, 0, 0); blctx.clearRect(0, 0, W / 2, H / 2);

  blctx.drawImage(cv, 0, 0, W / 2, H / 2);
  blctx.filter = 'none';
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = amount;

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

  ctx.save(); ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-hash(frame) * 160, -hash(frame + 9) * 160);
  ctx.fillStyle = noisePats[frame % noisePats.length]; ctx.fillRect(0, 0, W + 160, H + 160);
  ctx.restore();
  ctx.globalAlpha = vig; ctx.drawImage(vigCv, 0, 0, W, H); ctx.globalAlpha = 1;
}
function glitch(amount, frame) {
  if (amount < .02) return;

  bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
  if (amount > .2) {
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35 * clamp(amount);
    ctx.drawImage(buf, (r() - .5) * 36 * amount, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  const n = 2 + Math.floor(amount * 12);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = 2 + r() * (H * .07 * amount), dx = (r() - .5) * W * .16 * amount;
    ctx.drawImage(buf, 0, y, W, h, dx, y, W, h);
  }
  if (amount > .35) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < Math.floor(amount * 6); i++) { ctx.fillStyle = rgba([C.a, C.b, C.c][i % 3], .15 + r() * .35); ctx.fillRect(r() * W, r() * H, (20 + r() * 180) * amount, 2 + r() * 12); }
    ctx.globalCompositeOperation = 'source-over';
  }
}
function crtOff(k) {
  if (k <= 0) return;
  bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (k >= 1) return;
  const sy = k < .6 ? 1 - easeIn(k / .6) * .996 : .004, sx = k < .6 ? 1 : 1 - easeIn((k - .6) / .4);
  ctx.save(); ctx.translate(CX, CY); ctx.scale(sx, sy); ctx.drawImage(buf, -CX, -CY); ctx.restore();
  ctx.globalAlpha = clamp(k / .6) * .9; ctx.fillStyle = '#fff'; ctx.fillRect(CX - W * sx / 2, CY - 2, W * sx, 4); ctx.globalAlpha = 1;
}
// 章ラベルと下の進行バー（映像の中の小さなタイポ）
function chrome(t) {
  if (t < .8 || t > 29.2) return;
  const ch = [...CHAPTERS].reverse().find(c => t >= c.s);
  const onColor = t >= 19.5 && t < 23.5 && !(t >= 21.5 && t < 22.5);
  const col = onColor ? C.ink : rgba(C.b, .8);
  mono(ch.label, 60, 52, 15, col, 'left', 1);
  mono('NEON//CITY  CONCEPT FILM', W - 60, 52, 15, col, 'right', 1);
  ctx.fillStyle = onColor ? rgba(C.ink, .25) : rgba(C.b, .18); ctx.fillRect(60, H - 44, W - 120, 1);
  ctx.fillStyle = onColor ? C.ink : C.a; ctx.fillRect(60, H - 45, (W - 120) * t / DUR, 3);
  mono(`00:${String(Math.floor(t)).padStart(2, '0')}:${String(Math.floor(t * FPS % FPS)).padStart(2, '0')}`, W - 60, H - 64, 14, col, 'right', 1);
}

/* =========================================================
   1コマ
   ========================================================= */
function renderAt(frame) {
  const t = frame / FPS;

  chrome(t);
  post(t, frame, t >= 19.5 && t < 23.5 ? .45 : .72);
  let g = 0;
  CUTS.forEach(([c, a]) => { g = Math.max(g, a * (1 - Math.abs(t - c) / .2)); });
  // たまに入る小さなグリッチ（決まったコマで）
  if (hash(Math.floor(t * 6) + 77) > .93 && t > 1 && t < 27.5) g = Math.max(g, .3);
  glitch(g, frame);
  CUTS.forEach(([c, a]) => { const f = 1 - (t - c) / .1; if (t >= c && f > 0) { ctx.fillStyle = `rgba(255,255,255,${f * .3 * a})`; ctx.fillRect(0, 0, W, H); } });
  if (t >= 24) crtOff((t - 29.3) / .6);
}

window.ready = (async () => {
  await Promise.all(['900 100px Orbitron', '700 100px Orbitron', '500 100px Orbitron', '20px "Share Tech Mono"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  buildParticles(); buildPost();
  window.renderAt = renderAt;
  if (!location.search.includes('render')) {
    let f = 0, last = performance.now(), acc = 0;
    const loop = now => { acc += now - last; last = now; let n = 0; while (acc >= 1000 / FPS && n < 3) { f = (f + 1) % (DUR * FPS); acc -= 1000 / FPS; n++; } if (n) renderAt(f); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  return true;
})();
</script>
