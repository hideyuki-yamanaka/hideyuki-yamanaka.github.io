<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ぷるぷるフルーツ 3D</title>
<meta name="description" content="みかんのゼリーを包丁で切ったり、持ち上げて運んだり、ぷにぷに押したりできる3Dの画面">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="stage" aria-label="ゼリーで遊ぶテーブル"></canvas>

<button class="round-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="音を消す">
  <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>
</button>

<div class="tray" id="tray" role="group" aria-label="ふやすゼリー" hidden></div>

<div class="knife-ctrl" id="knifeCtrl" role="group" aria-label="包丁の角度" hidden>
  <label class="knife-row"><span>向き</span><input type="range" id="knifeYaw" min="-180" max="180" step="1" value="0"><output id="knifeYawOut">0°</output></label>
  <label class="knife-row"><span>傾き</span><input type="range" id="knifeTilt" min="-60" max="60" step="1" value="0"><output id="knifeTiltOut">0°</output></label>
</div>

<nav class="dock" aria-label="道具">
  <div class="dock-group" role="group" aria-label="モード">
    <button class="dock-btn" type="button" data-mode="touch" aria-pressed="true" aria-label="さわる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4a1.5 1.5 0 0 1 3 0v7.5"/><path d="M14 11.5V5.5a1.5 1.5 0 0 1 3 0v6.5"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V14a8 8 0 0 1-8 8h-1a7 7 0 0 1-5.2-2.3L3.4 17a1.6 1.6 0 0 1 2.3-2.2L8 17"/></svg>
      <span>さわる</span>
    </button>
    <button class="dock-btn" type="button" data-mode="knife" aria-pressed="false" aria-label="きる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3.5c-4.6 1.8-9.3 6.6-11.5 10.2l2.8 2.8C14.9 14.3 19.1 9.3 20 3.5Z"/><path class="thick" d="M9.6 15.9 4.5 21"/></svg>
      <span>きる</span>
    </button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <button class="dock-btn" type="button" id="addBtn" aria-expanded="false" aria-controls="tray" aria-label="ふやす">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>ふやす</span>
  </button>
  <button class="dock-btn" type="button" id="shakeBtn" aria-label="ゆらす">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c2-2 3.5-2 5.5 0s3.5 2 5.5 0 3.5-2 5.5 0"/><path d="M3 15c2-2 3.5-2 5.5 0s3.5 2 5.5 0 3.5-2 5.5 0"/></svg>
    <span>ゆらす</span>
  </button>
  <button class="dock-btn" type="button" id="resetBtn" aria-label="もどす">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
    <span>もどす</span>
  </button>
</nav>

<script src="tune-panel.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
