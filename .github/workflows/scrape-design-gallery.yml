name: Scrape Design Gallery

on:
  schedule:
    # 半日に1回（2026-09-17 ヒデさん指示「半日に一回スクレイピングが見れたり」）
    #   00:00 UTC = 09:00 JST ／ 12:00 UTC = 21:00 JST
    # ⚠️ GitHub の scheduled は混雑時に数十分ずれる（実測: 03:34〜03:54 UTC に着火）。
    #    「できればいい程度」の位置づけなので、ずれても追いかけない。
    - cron: '0 0,12 * * *'
  # 画面の「今すぐ取り込む」ボタン（/api/scrape）と、GitHub の Actions 画面の
  # 「Run workflow」からは、いつでも手で走らせられる
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-design-gallery
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design-gallery/package-lock.json

      - name: 依存インストール
        working-directory: design-gallery
        run: npm ci

      - name: Playwright ブラウザインストール
        working-directory: design-gallery
        run: npx playwright install --with-deps chromium

      - name: スクレイパー実行
        working-directory: design-gallery
        run: npx tsx scripts/scraper.ts
        env:
          MAX_81WEB_SITES: "3000"

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- design-gallery/src/data/scraped-sites.json; then
            echo "変更なし。スキップ。"
            exit 0
          fi
          # scrape-meta.json も必ず一緒にコミットする。
          # これを add し忘れると「最終スクレイプ時刻(scrapedAt)」がクライアントで
          # 据え置きになり、新着通知モーダルのベースラインが前進しなくなる。
          git add design-gallery/src/data/scraped-sites.json design-gallery/src/data/scrape-meta.json
          git commit -m "chore(design-gallery): scraped-sites.json 自動更新 ($(date -u +%Y-%m-%d))"

          # ⚠️ 取り込みに10分かかるので、その間にヒデさん／Claude が main へ push すると
          #    ここが ! [rejected] (fetch first) で落ちる。
          #    実測 2026-09-16 04:02 UTC の失敗がこれ（147行ぶんの新着が捨てられた）。
          #    → 相手の変更を取り込んでから押し直す。3回まで粘る。
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "push できました（${i}回目）"
              exit 0
            fi
            echo "push が弾かれました。5秒待って ${i} 回目のやり直し"
            sleep 5
          done
          echo "::error::3回試しても push できませんでした"
          exit 1
