<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビジョンの網ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--
  【2026-10-07 ヒデさん依頼】ビジョンの図(網のドーム＋真ん中の Anyflow Embed のロゴ)を、調整パネルと同じ項目で触って PNG に書き出す道具。
  ・「メッシュと Anyflow のロゴが入っている箇所だけ。5つの機能は要りません」→ 機能名(SDK など)は入れない
  ・「南半球はフェードの処理にしているが、ジェネレーターはフェードなしを既定に。フェードは付けられるように」→ 下のフェードは既定「しない」
  ・手元専用: http://localhost:8778/tools/vision-mesh-generator/ で開く(tools/ は .vercelignore で本番に載らない)
  ・描き方はサイトの写し(js/parts/05-edit-scroll.js の vfBuild・vfDraw、04-kv-motion.js の sphereFiboHull・meshSubdivide)。
    ⚠️ サイトの描き方を変えたら、ここも同じに直す(写しなので自動ではそろわない)
  ・つまみは共通の調整パネルの部品(tune-panel.js v2.3.0 の写し)。名前と範囲はサイトのビジョンタブと同じ
-->
<style>
  :root { --surface: #E7E7E7; --desk: #D6D6D6; --ink: #444; --ink-soft: #777; }
  html, body { margin: 0; height: 100%; background: var(--desk); color: var(--ink); font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }
  .stage { position: fixed; top: 0; bottom: 0; left: 0; right: 482px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; }
  .frame { line-height: 0; box-shadow: 0 1px 2px rgba(0, 0, 0, .10), 0 8px 24px rgba(0, 0, 0, .08); }
  .frame.clear { background-color: #fff; background-image: conic-gradient(#e2e2e2 25%, transparent 0 50%, #e2e2e2 0 75%, transparent 0); background-size: 16px 16px; }
  #view { display: block; }
  .meta { font-size: 12px; line-height: 1.6; color: var(--ink-soft); text-align: center; }
  .toast { position: fixed; left: calc((100% - 482px) / 2); bottom: 24px; transform: translateX(-50%); padding: 8px 16px; border-radius: 8px; background: rgba(17, 17, 17, .88); color: #fff; font-size: 12px; line-height: 1.6; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }
  @media (max-width: 900px) { .stage { right: 0; bottom: 45vh; } .toast { left: 50%; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" id="frame"><canvas id="view" aria-label="ビジョンの網とロゴの見本"></canvas></div>
  <div class="meta" id="meta"></div>
</div>
<div class="toast" id="toast"></div>
<script src="tune-panel.js"></script>
<script>
(() => {
  'use strict';

  /* ===== サイトと同じ値 ===== */
  const VF_CX = 291, VF_CY = 315;   /* 球の中心(サイトの図の容器の座標)。ロゴ・下のフェードもこの座標で決まる */
  /* サイトの既定(VF_DEF)のうち、この道具で使う物 */
  const VF_DEF = { meshKind: 'geo', fn: 92, freq: 3, sub: 1, subRound: 0, subDots: 1, r: 262, scale: 1.15, mx: 0, my: 0, mz: 0, tilt: -14, roll: 0, yaw: 0,
    msx: 1, msy: 1, msz: 1, mpinch: 0, spinOn: 1, spin: 0.6, lineColor: '#5F5F5F', lineAlpha: 0.85, lineWidth: 1, depthFade: 0, dot: 2.2, nodeMode: 'alt', levels: 1, pk: 0,
    fadeA: 0.42, fadeB: 0.66, logoOn: 1, logoScale: 1, logoDx: 0, logoDy: 0, logoOpacity: 1, bgBlur: 0, bgAlpha: 0, bgW: 1.6, bgH: 2.8 };
  /* 本番の値(js/parts/02-shipped.js の sections.vision.dome・2026-10-07 時点) */
  const SHIPPED_DOME = { scale: 1.38, tilt: 0, logoDx: 0, logoDy: -14, r: 251, logoScale: 1.14, lineWidth: 0.7, dot: 2.9, freq: 3, nodeMode: 'alt', levels: 0, pk: 4, roll: 0, yaw: 0,
    depthFade: 0.75, bgBlur: 0, bgAlpha: 0, bgW: 1.6, bgH: 2.8, logoOpacity: 1, fadeB: 0.68, fadeA: 0.18, msx: 1, msy: 1, msz: 1, mpinch: 0, lineAlpha: 0.9, spin: 0.6,
    lineColor: '#5F5F5F', sub: 1, subRound: 0, subDots: 1 };
  const MESH_KEYS = Object.keys(VF_DEF);
  const SITE_KEY = 'anyflow-embed-anim-v81';   /* サイト(localhost:8778)が調整パネルの値を保存している場所。同じアドレスなので読める */

  const DEFAULTS = {
    mesh: Object.assign({}, VF_DEF, SHIPPED_DOME, { fadeOn: 0 }),   /* fadeOn=下のフェード(この道具だけの値・既定「しない」) */
    view: { play: 1 },
    bg: { mode: 'grid', color: '#E7E7E7', gridColor: '#ACACAC', gridOp: 0.3, gridW: 0.5, cell: 44 },   /* サイトの地色と方眼(本番: マス44・線0.5・濃さ0.3) */
    out: { scale: 2, crop: 'fit', pad: 40 }
  };
  const params = structuredClone(DEFAULTS);

  /* ===== 網の作り方(サイトの写し) ===== */
  function vfBuild(f) {
    const t = (1 + Math.sqrt(5)) / 2, nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
    const th = -Math.atan2(t, 1), cth = Math.cos(th), sth = Math.sin(th);
    const base = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(nrm).map(v => [v[0], v[1] * cth - v[2] * sth, v[1] * sth + v[2] * cth]);
    const ICO_F = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    const verts = [], idx = new Map(); const key = (v) => v.map(x => x.toFixed(4)).join(',');
    const add = (v) => { const k = key(v); if (idx.has(k)) return idx.get(k); verts.push(v); idx.set(k, verts.length - 1); return verts.length - 1; };
    const edges = new Set(); const E = (a, b) => edges.add(a < b ? a * 65536 + b : b * 65536 + a);
    const faces = [];
    for (const [ia, ib, ic] of ICO_F) {
      const A = base[ia], B = base[ib], C = base[ic]; const grid = [];
      for (let i = 0; i <= f; i++) { grid[i] = []; for (let j = 0; j <= f - i; j++) { const u = i / f, w = j / f; grid[i][j] = add(nrm([A[0] + (B[0] - A[0]) * u + (C[0] - A[0]) * w, A[1] + (B[1] - A[1]) * u + (C[1] - A[1]) * w, A[2] + (B[2] - A[2]) * u + (C[2] - A[2]) * w])); } }
      for (let i = 0; i < f; i++) for (let j = 0; j < f - i; j++) { E(grid[i][j], grid[i + 1][j]); E(grid[i][j], grid[i][j + 1]); E(grid[i + 1][j], grid[i][j + 1]);
        faces.push([grid[i][j], grid[i + 1][j], grid[i][j + 1]]); if (j < f - i - 1) faces.push([grid[i + 1][j], grid[i + 1][j + 1], grid[i][j + 1]]); }
    }
    return { verts, edges: Array.from(edges).map(k => [Math.floor(k / 65536), k % 65536]), faces };
  }
  function sphereFiboHull(n) {
    n = Math.max(8, Math.round(n));
    const P = [];
    for (let i = 0; i < n; i++) { const y = 1 - ((i + 0.5) / n) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = Math.PI * (1 + Math.sqrt(5)) * i; P.push([Math.cos(th) * r, y, Math.sin(th) * r]); }
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const i0 = 0, i1 = n - 1, i2 = Math.floor(n / 2), i3 = Math.floor(n / 4);
    const C = [0, 1, 2].map(k => (P[i0][k] + P[i1][k] + P[i2][k] + P[i3][k]) / 4);
    const mk = (a, b, c) => { let nv = crs(sub(P[b], P[a]), sub(P[c], P[a])); const l = Math.hypot(nv[0], nv[1], nv[2]) || 1; nv = [nv[0] / l, nv[1] / l, nv[2] / l];
      if (dot(nv, sub(P[a], C)) < 0) { const t = b; b = c; c = t; nv = [-nv[0], -nv[1], -nv[2]]; } return { v: [a, b, c], n: nv, d: dot(nv, P[a]) }; };
    let F = [mk(i0, i1, i2), mk(i0, i1, i3), mk(i0, i2, i3), mk(i1, i2, i3)];
    const used = new Set([i0, i1, i2, i3]);
    for (let p = 0; p < n; p++) { if (used.has(p)) continue;
      const vis = [], keep = [];
      for (const f of F) (dot(f.n, P[p]) - f.d > 1e-10 ? vis : keep).push(f);
      if (!vis.length) continue;
      const cnt = new Map();
      for (const f of vis) for (let k = 0; k < 3; k++) { const a = f.v[k], b = f.v[(k + 1) % 3]; const key = a < b ? a + '_' + b : b + '_' + a; cnt.set(key, (cnt.get(key) || 0) + 1); }
      F = keep;
      for (const [key, c] of cnt) if (c === 1) { const [a, b] = key.split('_').map(Number); F.push(mk(a, b, p)); }
    }
    const es = new Set(), edges = [];
    for (const f of F) for (let k = 0; k < 3; k++) { const a = f.v[k], b = f.v[(k + 1) % 3]; const key = a < b ? a * 65536 + b : b * 65536 + a; if (!es.has(key)) { es.add(key); edges.push([Math.min(a, b), Math.max(a, b)]); } }
    return { verts: P, edges, faces: F.map(f => f.v.slice()) };
  }
  function meshSubdivide(mesh, n, round) {
    n = Math.max(1, Math.min(6, Math.round(n || 1))); round = Math.max(0, Math.min(1, +round || 0));
    if (n <= 1 || !mesh || !mesh.faces || !mesh.faces.length) return mesh;
    const verts = [], sub = [], idx = new Map();
    const add = (p, isSub) => { const k = p[0].toFixed(5) + ',' + p[1].toFixed(5) + ',' + p[2].toFixed(5); let i = idx.get(k); if (i == null) { i = verts.length; verts.push(p); sub.push(isSub); idx.set(k, i); } return i; };
    mesh.verts.forEach(v => add([v[0], v[1], v[2]], false));
    const es = new Set(), edges = [], faces = [];
    const E = (a, b) => { const k = a < b ? a * 1048576 + b : b * 1048576 + a; if (!es.has(k)) { es.add(k); edges.push([Math.min(a, b), Math.max(a, b)]); } };
    for (const [ia, ib, ic] of mesh.faces) {
      const A = mesh.verts[ia], B = mesh.verts[ib], C = mesh.verts[ic], g = [];
      for (let i = 0; i <= n; i++) { g[i] = []; for (let j = 0; j <= n - i; j++) { const u = i / n, w = j / n;
        g[i][j] = add([A[0] + (B[0] - A[0]) * u + (C[0] - A[0]) * w, A[1] + (B[1] - A[1]) * u + (C[1] - A[1]) * w, A[2] + (B[2] - A[2]) * u + (C[2] - A[2]) * w], true); } }
      for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) {
        const a = g[i][j], b = g[i + 1][j], c = g[i][j + 1]; E(a, b); E(b, c); E(c, a); faces.push([a, b, c]);
        if (j < n - i - 1) { const d = g[i + 1][j + 1]; E(b, d); E(d, c); faces.push([b, d, c]); } }
    }
    if (round > 0) for (let i = 0; i < verts.length; i++) { if (!sub[i]) continue; const v = verts[i], l = Math.hypot(v[0], v[1], v[2]) || 1; for (let k = 0; k < 3; k++) v[k] += (v[k] / l - v[k]) * round; }
    return { verts, edges, faces, sub };
  }
  let meshCache = null, meshKey = '';
  function getMesh(c) {
    const f = Math.max(1, Math.min(4, Math.round(c.freq)));
    const fibo = c.meshKind === 'fibo', fn = Math.max(12, Math.min(400, Math.round(c.fn || 92)));
    const sub = Math.max(1, Math.min(4, Math.round(c.sub || 1))), subR = Math.max(0, Math.min(1, c.subRound || 0));
    const key = (fibo ? 'f' + fn : 'g' + f) + '_s' + sub + '_' + subR.toFixed(2);
    if (!meshCache || meshKey !== key) { meshCache = meshSubdivide(fibo ? sphereFiboHull(fn) : vfBuild(f), sub, subR); meshKey = key; pk.list.length = 0; }
    return meshCache;
  }

  /* ===== 投影(サイトの vfDraw と同じ回転・傾き・形) ===== */
  function project(c, tSec) {
    const mesh = getMesh(c);
    const cx = VF_CX + (c.mx || 0), cy = VF_CY + (c.my || 0), R = c.r * (c.scale != null ? c.scale : 1) * (1 + (c.mz || 0) / 100);
    const spinOn = !(c.spinOn === 0 || c.spinOn === false);
    const a = (spinOn ? tSec : 0) * c.spin * 0.12 + (c.yaw || 0) * Math.PI / 180, tl = c.tilt * Math.PI / 180, rl = (c.roll || 0) * Math.PI / 180;
    const ca = Math.cos(a), sa = Math.sin(a), ct = Math.cos(tl), st = Math.sin(tl), cr = Math.cos(rl), sr = Math.sin(rl);
    const msx = c.msx != null ? c.msx : 1, msy = c.msy != null ? c.msy : 1, msz = c.msz != null ? c.msz : 1, mp = c.mpinch || 0;
    const P = mesh.verts.map(v => {
      let wx = v[0], wy = v[1], wz = v[2];
      if (mp) { const k = 1 - mp * Math.abs(wy); wx *= k; wz *= k; }
      wx *= msx; wy *= msy; wz *= msz;
      const x1 = wx * ca + wz * sa, z1 = -wx * sa + wz * ca; const y2 = wy * ct - z1 * st, z2 = wy * st + z1 * ct; const x3 = x1 * cr - y2 * sr, y3 = x1 * sr + y2 * cr;
      return [cx + x3 * R, cy - y3 * R, (z2 + 1) / 2];
    });
    return { mesh, P, cx, cy, R, ext: R * Math.max(msx, msy, msz) };
  }

  /* ===== 骨を走る光(パケット)。サイトと同じ出方。書き出しの時は進めない(その瞬間のまま) ===== */
  const pk = { list: [], next: 0 };
  function stepPackets(c, mesh, dt) {
    if ((c.pk || 0) > 0) { pk.next -= dt; if (pk.next <= 0 && pk.list.length < 14) { pk.next = 1 / c.pk; const e = mesh.edges[(Math.random() * mesh.edges.length) | 0]; pk.list.push({ a: e[0], b: e[1], k: 0, dur: 0.7 + Math.random() * 0.5 }); } } else pk.list.length = 0;
    for (let i = pk.list.length - 1; i >= 0; i--) { const q = pk.list[i]; q.k += dt / q.dur; if (q.k >= 1) pk.list.splice(i, 1); }
  }

  /* ===== 網を描く(サイトの vfDraw の線・点・光) ===== */
  const PINK = '255,93,151', CYAN = '14,187,255', NAVY = '14,68,151', PALE = '157,176,201';
  const VF_LV_LINE = [0.2, 0.4, 0.6, 1.0], VF_LV_NODE = [0.2, 0.4, 0.7, 1.0];
  function rgb(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')); const v = parseInt(m ? m[1] : 'a6a6a6', 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255].join(','); }
  function drawMesh(g, c, pr) {
    const { mesh, P } = pr;
    g.lineCap = 'round';
    const lc = rgb(c.lineColor || '#A6A6A6'), lw = (c.lineWidth != null ? c.lineWidth : 1), quant = (c.levels == null ? 1 : c.levels) > 0.5;
    const bin = (k) => Math.min(3, Math.floor(k * 4));
    const df = c.depthFade || 0;
    for (const [i, j] of mesh.edges) { const A = P[i], B = P[j]; const k = (A[2] + B[2]) / 2;
      const al = quant ? c.lineAlpha * VF_LV_LINE[bin(k)] : c.lineAlpha * (0.42 + 0.58 * k);
      g.strokeStyle = 'rgba(' + lc + ',' + (al * (1 - df * (1 - k))).toFixed(3) + ')'; g.lineWidth = (quant ? (k > 0.5 ? lw : lw * 0.7) : lw * (0.7 + 0.3 * k)) * (1 - 0.5 * df * (1 - k)); g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke(); }
    const hideSub = c.subDots === 0 && mesh.sub;
    for (let i = 0; i < P.length; i++) { if (hideSub && mesh.sub[i]) continue; const [x, y, k] = P[i]; let col, al, rad;
      if ((c.nodeMode || 'alt') === 'alt') { col = (i % 2) ? PINK : CYAN; if (quant) { al = VF_LV_NODE[bin(k)]; rad = c.dot * (0.55 + 0.45 * k); } else { const dep = 0.72 + 0.5 * k; al = 0.5 + 0.5 * dep; rad = c.dot * dep; } }
      else { const h = ((i + 1) * 2654435761 % 4294967296) / 4294967296; col = h < 0.12 ? PINK : h < 0.24 ? CYAN : h < 0.28 ? NAVY : PALE; al = (col === PALE) ? (0.3 + 0.45 * k) : (0.45 + 0.55 * k); rad = c.dot * (0.55 + 0.45 * k); }
      g.fillStyle = 'rgba(' + col + ',' + (al * (1 - df * (1 - k))).toFixed(3) + ')'; g.beginPath(); g.arc(x, y, rad * (1 - 0.35 * df * (1 - k)), 0, Math.PI * 2); g.fill(); }
    for (const q of pk.list) { const A = P[q.a], B = P[q.b]; if (!A || !B) continue; const x = A[0] + (B[0] - A[0]) * q.k, y = A[1] + (B[1] - A[1]) * q.k, k = A[2] + (B[2] - A[2]) * q.k; const fade = Math.sin(q.k * Math.PI);
      g.fillStyle = 'rgba(' + ((q.a % 2) ? PINK : CYAN) + ',' + ((0.35 + 0.5 * k) * (1 - df * (1 - k))).toFixed(3) + ')'; g.beginPath(); g.arc(x, y, c.dot * (0.9 + 0.6 * k) * (0.6 + 0.4 * fade), 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,' + (0.5 * fade).toFixed(3) + ')'; g.beginPath(); g.arc(x, y, c.dot * 0.45, 0, Math.PI * 2); g.fill(); }
  }

  /* ===== ロゴ・下のフェード・ロゴの後ろの楕円の位置(サイトの applyVfFade と同じ式) ===== */
  function layout(c) {
    const sc = (c.scale != null ? c.scale : 1);
    const fy = (f) => VF_CY + (c.my || 0) + (f * 600 - VF_CY) * sc;
    const ls = sc * (c.logoScale != null ? c.logoScale : 1);
    const lw = 204 * ls, lh = 37 * ls, lcx = VF_CX + (c.logoDx || 0), lcy = VF_CY + (c.logoDy || 0) - 50;
    const logoOn = !(c.logoOn === 0 || c.logoOn === false);
    const bgOn = logoOn && ((c.bgBlur || 0) > 0.05 || (c.bgAlpha || 0) > 0.005);
    const bw = lw * (c.bgW != null ? c.bgW : 1.6), bh = lh * (c.bgH != null ? c.bgH : 2.8);
    return { fadeOn: !!c.fadeOn, fa: fy(c.fadeA), fb: fy(Math.max(c.fadeA + 0.02, c.fadeB)), logoOn, lw, lh, lcx, lcy, bgOn, bw, bh };
  }

  /* ===== 書き出す範囲(回っても大きさが変わらないよう、球の外形で決める) ===== */
  function cropOf(c, pr, L) {
    const m = pr.ext + (c.dot || 2) * 1.6 + (c.lineWidth || 1);
    let x0 = pr.cx - m, x1 = pr.cx + m, y0 = pr.cy - m, y1 = pr.cy + m;
    if (L.fadeOn) y1 = Math.min(y1, L.fb);
    if (L.logoOn) { const hw = Math.max(L.lw, L.bgOn ? L.bw : 0) / 2, hh = Math.max(L.lh, L.bgOn ? L.bh : 0) / 2; x0 = Math.min(x0, L.lcx - hw); x1 = Math.max(x1, L.lcx + hw); y0 = Math.min(y0, L.lcy - hh); y1 = Math.max(y1, L.lcy + hh); }
    const pad = Math.max(0, params.out.pad || 0); x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    if (params.out.crop === 'square') { const s = Math.max(x1 - x0, y1 - y0), mx = (x0 + x1) / 2, my = (y0 + y1) / 2; x0 = mx - s / 2; x1 = mx + s / 2; y0 = my - s / 2; y1 = my + s / 2; }
    return { x: Math.floor(x0), y: Math.floor(y0), w: Math.ceil(x1) - Math.floor(x0), h: Math.ceil(y1) - Math.floor(y0) };
  }

  /* ===== 1枚に重ねる(背景・方眼 → 網(下のフェード) → ロゴの後ろの楕円 → ロゴ)。サイトの重なり順と同じ ===== */
  const logoImg = new Image(); let logoReady = false;

          { slider: '余白', path: 'out.pad', min: 0, max: 200, step: 4, fmt: v => Math.round(v) + 'px', hint: '図のまわりに足す余白(書き出しの 1倍の大きさで)。' },
          { button: 'PNG を書き出す', primary: true, onClick: () => exportPNG() }
        ]}
      ]}
    ]
  });

  if (location.protocol === 'file:') meta.textContent = '⚠️ ファイルを直接開いています。書き出すには http://localhost:8778/tools/vision-mesh-generator/ で開いてください';
  window.__visionMeshGen = { params, renderPNG, loadSite, setTime: v => { tSec = v; }, pk };   /* 確かめ用 */
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
