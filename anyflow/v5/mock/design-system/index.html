<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>anyflow V3 デザイン整備 レベル比較</title>
<style>
  :root{
    --cyan:#0EBBFF; --pink:#FF5D97; --ink:#101828; --bg:#e7e7e7;
    --line:#d8dde5; --card:#fff; --muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',-apple-system,sans-serif;color:var(--ink);background:var(--bg);
       display:flex;flex-direction:column;overflow:hidden}
  header{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
         padding:10px 14px 0;box-shadow:0 1px 6px rgba(16,24,40,.06);z-index:2}
  .ttl{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ttl small{font-weight:400;color:var(--muted);font-size:11px}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{flex:1 1 0;min-width:0;border:1px solid var(--line);border-bottom:none;
       background:#f5f6f8;color:var(--muted);border-radius:9px 9px 0 0;
       padding:9px 6px 10px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;
       display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
  .tab small{font-weight:400;font-size:10px;opacity:.8}
  .tab:hover{background:#eef0f3}
  .tab.on{background:var(--card);color:var(--ink);border-color:var(--line);position:relative;top:1px}
  .tab.on.low{box-shadow:inset 0 3px 0 #16a34a}
  .tab.on.mid{box-shadow:inset 0 3px 0 var(--cyan)}
  .tab.on.high{box-shadow:inset 0 3px 0 var(--pink)}
  .bar{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;font-size:11.5px;color:#374151;
       border-top:1px solid var(--line);flex-wrap:wrap}
  .bar .desc{flex:1 1 240px;line-height:1.55}
  .bar .badge{flex:0 0 auto;background:#f5f6f8;border:1px solid var(--line);border-radius:999px;
       padding:3px 10px;font-weight:600;font-size:11px;white-space:nowrap}
  .bar b{color:var(--ink)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  .chip{font-size:10.5px;color:#4b5563;background:#f5f6f8;border:1px solid var(--line);
        border-radius:6px;padding:2px 7px;white-space:nowrap}
  .frame{flex:1 1 auto;position:relative;background:#e7e7e7}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#e7e7e7}
  .hintbtn{background:none;border:0;color:var(--cyan);font:inherit;font-size:11px;cursor:pointer;
           padding:0;text-decoration:underline;flex:0 0 auto}
</style>
</head>
<body>
<header>
  <div class="ttl">anyflow V3 デザイン整備 <small>レベル比較（Low / Mid / High）</small></div>
  <div class="tabs">
    <button class="tab low on" data-ds="low"><span>Low</span><small>最小整備</small></button>
    <button class="tab mid" data-ds="mid"><span>Mid</span><small>バランス</small></button>
    <button class="tab high" data-ds="high"><span>High</span><small>積極整備</small></button>
  </div>
  <div class="bar">
    <div class="desc" id="desc"></div>
    <div class="badge" id="badge"></div>
    <div style="flex-basis:100%"><div class="chips" id="chips"></div></div>
  </div>
</header>
<div class="frame"><iframe id="site" title="anyflow V3"></iframe></div>
<script>
  var LEVELS = {
    low:{
      badge:'色トークン 22 / 現行と同一',
      desc:'<b>今の値をそのまま温存</b>して、名前を付けただけ。見た目は現行 V3 と <b>完全に一致</b>（実測で全要素0差分を確認済み）。まず安全に「出どころを1か所に集めた」段階。',
      chips:['色はすべて別トークン','スペーシングは現状維持','見た目の変化：なし']
    },
    mid:{
      badge:'色トークン 20 / ほぼ不変',
      desc:'<b>見分けのつかない重複だけ</b>を1つに。コードモックの緑2色を統合、フッター暗色をほぼ同値の開発暗色へ寄せる。<b>目で見た変化はほぼゼロ</b>、トークンだけ整理。',
      chips:['コード緑 2→1','フッター暗色を統合','見た目の変化：ごくわずか']
    },
    high:{
      badge:'色トークン 14 / ★採用（既定）',
      desc:'<b>色数もトークン数も最小化</b>。<b>サーフェスを4色に集約</b>（端末→CTA黒／モック地→暗色）、罫線グレーを1本化、ラベルのグレーを本文色へ、コード緑を1つに、角丸を段数削減（24→16 / 14→8）、はみ出し余白（27/34/59px）を8pxグリッドへスナップ。<b>本番の既定に採用</b>。',
      chips:['サーフェス 9→4色','罫線グレー 2→1','ラベル灰→本文色','角丸を集約','余白を8pxグリッドへ']
    }
  };
  var site=document.getElementById('site');
  function set(ds){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.ds===ds);});
    var L=LEVELS[ds];
    document.getElementById('desc').innerHTML=L.desc;
    document.getElementById('badge').textContent=L.badge;
    document.getElementById('chips').innerHTML=L.chips.map(function(c){return '<span class="chip">'+c+'</span>';}).join('');
    site.src='../../index.html?ds='+ds;
    try{location.hash=ds;}catch(e){}
  }
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){set(t.dataset.ds);});
  });
  var init=(location.hash||'').replace('#','');
  set(['low','mid','high'].indexOf(init)>=0?init:'high');
</script>
</body>
</html>
